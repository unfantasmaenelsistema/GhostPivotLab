<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" fill="none">
  <defs>
    <linearGradient id="top-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="top-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="500" rx="12" fill="url(#top-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="32" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Arquitectura de Red y Métodos de Pivoting Simulados</text>
  <text x="32" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">eJPTv2 Exam Scenarios • Routing • Tunneling • Port Redirection</text>

  <!-- Section 1: Metasploit Autoroute + Portfwd -->
  <g transform="translate(32, 80)">
    <rect width="936" height="115" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" filter="url(#top-shadow)"/>
    <rect x="0" y="0" width="6" height="115" rx="3" fill="#0284c7"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Escenario 1: Metasploit Framework (Autoroute &amp; Portfwd)</text>
    
    <!-- Flow boxes -->
    <!-- Kali -->
    <rect x="20" y="38" width="160" height="60" rx="6" fill="#020617" stroke="#334155"/>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Kali Linux</text>
    <text x="30" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">192.168.1.100</text>
    <text x="30" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">auxiliary/server/socks</text>

    <!-- Arrow 1 -->
    <path d="M 185 68 L 265 68" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Meterpreter</text>

    <!-- Pivot -->
    <rect x="270" y="38" width="220" height="60" rx="6" fill="#020617" stroke="#10b981"/>
    <text x="280" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Dual-NIC Compromised Pivot</text>
    <text x="280" y="72" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">NIC1: 192.168.1.50 (Acceso)</text>
    <text x="280" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b">NIC2: 10.10.10.5 (Interno)</text>

    <!-- Arrow 2 -->
    <path d="M 495 68 L 575 68" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="502" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">run autoroute</text>

    <!-- Internal Target -->
    <rect x="580" y="38" width="180" height="60" rx="6" fill="#020617" stroke="#ef4444"/>
    <text x="590" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Internal Target</text>
    <text x="590" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">10.10.10.15</text>
    <text x="590" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ef4444">Port 80 HTTP, 445 SMB</text>

    <!-- Key command box -->
    <rect x="775" y="38" width="145" height="60" rx="6" fill="#1e293b"/>
    <text x="785" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">portfwd add</text>
    <text x="785" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1">-l 8080 -p 80</text>
    <text x="785" y="86" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1">-r 10.10.10.15</text>
  </g>

  <!-- Section 2: Chisel Reverse Tunnel -->
  <g transform="translate(32, 210)">
    <rect width="936" height="115" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" filter="url(#top-shadow)"/>
    <rect x="0" y="0" width="6" height="115" rx="3" fill="#10b981"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">Escenario 2: Chisel Reverse SOCKS Tunnel (HTTP / WebSockets)</text>

    <!-- Kali -->
    <rect x="20" y="38" width="190" height="60" rx="6" fill="#020617" stroke="#334155"/>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Kali (Chisel Server)</text>
    <text x="30" y="74" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">chisel server --reverse</text>
    <text x="30" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10b981">Escucha en :8000</text>

    <!-- Arrow 1 (Reverse) -->
    <path d="M 270 68 L 215 68" stroke="#10b981" stroke-width="2"/>
    <text x="218" y="60" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399">← Conexión inversa</text>

    <!-- Pivot -->
    <rect x="275" y="38" width="220" height="60" rx="6" fill="#020617" stroke="#10b981"/>
    <text x="285" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Pivot (Chisel Client)</text>
    <text x="285" y="72" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#cbd5e1">chisel client 192.168.1.100:8000</text>
    <text x="285" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b">R:socks (SOCKS5 reverse)</text>

    <!-- Target -->
    <rect x="580" y="38" width="180" height="60" rx="6" fill="#020617" stroke="#ef4444"/>
    <text x="590" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Internal Hosts</text>
    <text x="590" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">172.16.50.0/24</text>
    <text x="590" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ef4444">Scan vía Proxychains</text>

    <!-- Key command box -->
    <rect x="775" y="38" width="145" height="60" rx="6" fill="#1e293b"/>
    <text x="785" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">proxychains4</text>
    <text x="785" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1">nmap -sT -Pn</text>
    <text x="785" y="86" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1">172.16.50.20</text>
  </g>

  <!-- Section 3: SSH Port Forwarding & Netsh -->
  <g transform="translate(32, 340)">
    <rect width="936" height="115" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" filter="url(#top-shadow)"/>
    <rect x="0" y="0" width="6" height="115" rx="3" fill="#8b5cf6"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Escenario 3: SSH Port Forwarding Local/Dinámico &amp; Windows Netsh</text>

    <!-- Kali -->
    <rect x="20" y="38" width="220" height="60" rx="6" fill="#020617" stroke="#334155"/>
    <text x="30" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">SSH Client (Kali)</text>
    <text x="30" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc">ssh -L 8080:target:80 user@pivot</text>
    <text x="30" y="88" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc">ssh -D 1080 -N user@pivot</text>

    <!-- Pivot -->
    <rect x="290" y="38" width="230" height="60" rx="6" fill="#020617" stroke="#8b5cf6"/>
    <text x="300" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">SSH Server / Windows Pivot</text>
    <text x="300" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#cbd5e1">sshd / netsh interface portproxy</text>
    <text x="300" y="86" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f59e0b">Forwarding TCP Packets</text>

    <!-- Target -->
    <rect x="580" y="38" width="180" height="60" rx="6" fill="#020617" stroke="#ef4444"/>
    <text x="590" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Segregated Server</text>
    <text x="590" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Internal Database</text>
    <text x="590" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ef4444">MySQL (3306), RDP (3389)</text>

    <!-- Key command box -->
    <rect x="775" y="38" width="145" height="60" rx="6" fill="#1e293b"/>
    <text x="785" y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#c084fc">netsh portproxy</text>
    <text x="785" y="72" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#cbd5e1">add v4tov4</text>
    <text x="785" y="86" font-family="'JetBrains Mono', monospace" font-size="7.8" fill="#cbd5e1">listenport=8080...</text>
  </g>

  <!-- Footer note -->
  <text x="32" y="480" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
    Desarrollado para la preparación oficial del eJPTv2. Autor: <tspan font-weight="700" fill="#38bdf8">Un Fantasma En El Sistema</tspan> (https://www.unfantasmaenelsistema.com/)
  </text>
</svg>
